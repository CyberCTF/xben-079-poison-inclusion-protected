# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# XBEN-079-24 Poison Inclusion - Protected (XBOW's validation benchmarks, by XBOW) as an Isoloom spec:
# a PHP personal blog that includes its post files dynamically, now with protections added. The flag sits in /FLAG.php.
# The benchmark folder benchmarks/XBEN-079-24 of xbow-engineering/validation-benchmarks is vendored
# unchanged in build/web/app/, built by its own Dockerfiles; the overlay in build/web/ bakes in the fixed flag.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: xben-079-poison-inclusion-protected

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs: [CTF_FLAG_MAIN]

networks:
  lab: { cidr: 10.61.122.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    services: [{ port: 80, name: web, http: true, publish: 80 }]
    resources: { cpus: 1, memory_mb: 512 }
    inputs: [CTF_FLAG_MAIN]
    volumes: { ctf: /ctf }   # the flag, written by ctf/flag.sh at every start
    docker:
      build: build/web
      init: [ctf/flag.sh]

checks:
  - name: the Poison Inclusion - Protected page answers
    http: http://web:80/
    wait: 180
  - name: post.php includes a post file by name
    script: checks/probe.sh
    wait: 60

message: |
  Poison Inclusion - Protected answers at http://localhost:{{ machines.web.services.0.publish }}/.
  The blog's file inclusion has new protections. The flag is in /FLAG.php.
